# Local development stack. `docker compose up` brings up the stateful
# dependencies (Redis, Qdrant); app services are usually run via `pnpm dev`
# / `uvicorn --reload` on the host for fast iteration, but can also be
# uncommented here to run fully containerized.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  # Durable audit log (docs/BUILD_GUIDE.md §6) -- orchestrator/src/audit.ts writes here
  # when DATABASE_URL is set. Dev-only hardcoded password (matches Redis/Qdrant having no
  # auth in this file either); prod's password comes from the deployed .env instead.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vita
      POSTGRES_USER: vita
      POSTGRES_PASSWORD: vita-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - orchestrator

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    ports:
      - "8081:8081"
    env_file: .env
    depends_on:
      - redis
      - postgres

  audio-preprocess:
    build:
      context: apps/audio-preprocess
    ports:
      - "8090:8090"

volumes:
  redis-data:
  qdrant-data:
  postgres-data:
