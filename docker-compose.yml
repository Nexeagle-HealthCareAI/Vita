# Local development stack. `docker compose up` brings up the stateful
# dependencies (Redis, Qdrant); app services are usually run via `pnpm dev`
# / `uvicorn --reload` on the host for fast iteration, but can also be
# uncommented here to run fully containerized.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - orchestrator

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    ports:
      - "8081:8081"
    env_file: .env
    depends_on:
      - redis

  audio-preprocess:
    build:
      context: apps/audio-preprocess
    ports:
      - "8090:8090"

volumes:
  redis-data:
  qdrant-data:
