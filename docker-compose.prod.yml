# Phase 1 stack — one E2E Networks VM, used for BOTH dev and prod deploys (same
# compose file, different VM + .env per environment -- see
# .github/workflows/deploy.yml's deploy-dev/deploy-prod jobs). Images are pulled
# from ghcr.io rather than built on the VM. See docs/BUILD_GUIDE.md §7.
#
# No nginx/TLS termination here -- this VM is shared with other EasyHMS
# services and already runs a reverse proxy in front of it; Vita's domain
# routing is a site block on that proxy, not something this repo owns.
#
# IMAGE_TAG comes from the generated .env (deploy-dev writes "develop", deploy-prod
# writes "latest") so each environment's VM pulls its own build, not whichever branch
# happened to push last.
services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.5
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  gateway:
    image: ghcr.io/nexeagle-healthcareai/vita-gateway:${IMAGE_TAG:-latest}
    env_file: .env
    # Exposed on the host so CI's deploy health check can reach it directly, and
    # so the VM's shared reverse proxy has a port to route Vita's domain to --
    # same raw-port health-check convention used elsewhere in this org (e.g.
    # easyHMSAPI's deploy-api.yml).
    ports:
      - "8080:8080"
    depends_on:
      - orchestrator
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure

  orchestrator:
    image: ghcr.io/nexeagle-healthcareai/vita-orchestrator:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  audio-preprocess:
    image: ghcr.io/nexeagle-healthcareai/vita-audio-preprocess:${IMAGE_TAG:-latest}
    restart: unless-stopped

volumes:
  redis-data:
  qdrant-data:
