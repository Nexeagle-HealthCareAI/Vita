# TLS termination + WebSocket upgrade for the Tera gateway.
# Certs: use certbot (Let's Encrypt) on the E2E VM and mount the resulting
# fullchain.pem/privkey.pem into ./infra/nginx/certs — see BUILD_GUIDE §7.3.

server {
    listen 80;
    server_name gateway.tera.hospital;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gateway.tera.hospital;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.3;

    location /session/ticket {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/stream {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Sticky-ish for Phase 1 single-gateway-instance; revisit with
        # ip_hash/consistent hashing once the gateway scales horizontally.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://gateway:8080;
    }
}
