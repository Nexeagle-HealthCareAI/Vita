name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  # Lets a maintainer manually run the real-model audio-preprocess suite (see the
  # audio-preprocess-slow job below) or the 1HMS contract test on demand, without
  # needing local Python/torch/Rust setup or waiting for the nightly schedule below --
  # never fires on its own, never blocks a PR.
  workflow_dispatch:
  # Drives mcp-1hms-contract only (see that job) -- a real check against a real external
  # service belongs on a schedule, not gating every PR. 03:00 UTC ~= off-peak for both
  # India and US audiences.
  schedule:
    - cron: '0 3 * * *'

jobs:
  # The nightly `schedule` trigger above exists only to drive mcp-1hms-contract -- every
  # other job here stays PR/push/manual-only (`schedule` firing them too would just be
  # wasted CI minutes re-running things nothing changed for).
  node:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input here -- package.json's packageManager field (pnpm@9.12.0)
      # already pins it, and pnpm/action-setup@v4 errors if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:ci

  audio-preprocess:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/audio-preprocess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/audio-preprocess/requirements.txt
      - run: pip install -r requirements.txt
      # Bare `pytest` doesn't add the cwd to sys.path, so `from app.main import
      # app` fails with ModuleNotFoundError; `python -m pytest` does add it.
      # `-m "not slow"` skips tests/test_models_integration.py, which loads real model
      # weights (Silero VAD, DeepFilterNet) -- kept out of the default CI gate per
      # docs/BUILD_GUIDE.md §3.4; run manually via `python -m pytest -q -m slow`.
      - run: python -m pytest -q -m "not slow"

  # Real Silero VAD + DeepFilterNet weights against real (TTS-synthesized) speech
  # fixtures -- manual-only (see the workflow_dispatch trigger above), never blocks a
  # PR. Deliberately NOT added to the `audio-preprocess` job above: real model loading
  # is meaningfully slower and needs a real torch.hub network fetch, matching the
  # already-established `-m "not slow"` boundary this repeats rather than reconsiders.
  audio-preprocess-slow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/audio-preprocess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/audio-preprocess/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -m slow

  web-demo-e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: node
    # A hung `playwright install` (CDN flakiness / apt lock contention) previously had no
    # bound here and could burn GitHub's full 360-minute default job timeout in silence --
    # this converts that into a fast, visible failure instead.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # web-sdk imports @vita/protocol's build output, so it must be built first --
      # unlike the node job, this job calls pnpm directly rather than through turbo,
      # which is what normally handles that ordering.
      - run: pnpm --filter @vita/protocol build
      - run: pnpm --filter @vita/web-sdk build
      # Playwright's browser binaries live outside pnpm's own store (setup-node's
      # cache: pnpm doesn't cover this) -- cache them keyed on the lockfile hash (which
      # changes whenever @playwright/test's resolved version does) so a normal run reuses
      # the prior download instead of re-fetching Chromium from scratch every time, one of
      # the two real contributors (alongside apt lock contention) to this job's recurring
      # hangs. OS-level deps (--with-deps) still install on every run regardless of this
      # cache -- GitHub-hosted runners are fresh VMs with nothing at the apt layer to reuse.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright (chromium + OS deps), retrying once on failure
        run: |
          for i in 1 2; do
            if pnpm --filter @vita/web-demo exec playwright install --with-deps chromium; then exit 0; fi
            echo "playwright install attempt $i failed, retrying..."
          done
          exit 1
      - run: pnpm --filter @vita/web-demo test

  # Real, live easyHMSAPI contract test (packages/mcp-1hms/test/hmsClient.contract.test.ts)
  # -- catches drift if easyHMSAPI's /public/* surface changes, something the mocked
  # hmsClient.test.ts can't. Nightly (see the `schedule` trigger above) + on-demand only:
  # depends on an external dev service being up, and its bookAppointment case is a real
  # write, so it must never gate a PR. No HMS_API_BASE_URL/HMS_API_KEY set here
  # deliberately -- the test file's own default (the real dev easyHMSAPI) already covers
  # this; setting an empty-string env var here (e.g. from an unconfigured `vars.*`) would
  # silently defeat that default, since JS's `??` only falls back on null/undefined, not
  # `""`. Add real secrets/vars here only once there's an actual different target to use.
  mcp-1hms-contract:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vita/mcp-1hms test:contract
