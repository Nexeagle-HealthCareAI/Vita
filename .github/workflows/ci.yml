name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input here -- package.json's packageManager field (pnpm@9.12.0)
      # already pins it, and pnpm/action-setup@v4 errors if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:ci

  audio-preprocess:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/audio-preprocess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/audio-preprocess/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  web-demo-e2e:
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vita/web-sdk build
      - run: pnpm --filter @vita/web-demo exec playwright install --with-deps chromium
      - run: pnpm --filter @vita/web-demo test
