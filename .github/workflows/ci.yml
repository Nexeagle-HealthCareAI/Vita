name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  # Lets a maintainer manually run the real-model audio-preprocess suite (see the
  # audio-preprocess-slow job below) on demand, without needing local Python/torch/Rust
  # setup -- never fires on its own, never blocks a PR.
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input here -- package.json's packageManager field (pnpm@9.12.0)
      # already pins it, and pnpm/action-setup@v4 errors if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:ci

  audio-preprocess:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/audio-preprocess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/audio-preprocess/requirements.txt
      - run: pip install -r requirements.txt
      # Bare `pytest` doesn't add the cwd to sys.path, so `from app.main import
      # app` fails with ModuleNotFoundError; `python -m pytest` does add it.
      # `-m "not slow"` skips tests/test_models_integration.py, which loads real model
      # weights (Silero VAD, DeepFilterNet) -- kept out of the default CI gate per
      # docs/BUILD_GUIDE.md §3.4; run manually via `python -m pytest -q -m slow`.
      - run: python -m pytest -q -m "not slow"

  # Real Silero VAD + DeepFilterNet weights against real (TTS-synthesized) speech
  # fixtures -- manual-only (see the workflow_dispatch trigger above), never blocks a
  # PR. Deliberately NOT added to the `audio-preprocess` job above: real model loading
  # is meaningfully slower and needs a real torch.hub network fetch, matching the
  # already-established `-m "not slow"` boundary this repeats rather than reconsiders.
  audio-preprocess-slow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/audio-preprocess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/audio-preprocess/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -m slow

  web-demo-e2e:
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # web-sdk imports @vita/protocol's build output, so it must be built first --
      # unlike the node job, this job calls pnpm directly rather than through turbo,
      # which is what normally handles that ordering.
      - run: pnpm --filter @vita/protocol build
      - run: pnpm --filter @vita/web-sdk build
      - run: pnpm --filter @vita/web-demo exec playwright install --with-deps chromium
      - run: pnpm --filter @vita/web-demo test
